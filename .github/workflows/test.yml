name: 🧪 Test/Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-lint:
    name: Test/Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21', '1.22' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Tests
        run: go test ./...

      - name: Linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56.2
